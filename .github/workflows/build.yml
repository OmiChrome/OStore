name: Build

# Every 2 days: look for new stable patches and build only the apps that need it.
# Also runs when apps/ or the scripts change: then it builds only apps that are new,
# changed, or never built successfully.
on:
  push:
    branches: [main]
    paths: ["apps/**", "scripts/**"]
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "App ids to build, space separated (empty = only apps with new patches)"
        required: false
        default: ""
      force:
        description: "Rebuild every app even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

# One writer at a time for state/ and engine.lock.
concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Plan
        id: plan
        env:
          ONLY: ${{ inputs.apps }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python3 scripts/ostore.py plan --only "$ONLY" $FORCE

      - name: Restore original APKs from cache
        id: restore
        if: steps.plan.outputs.count != '0'
        uses: actions/cache/restore@v6
        with:
          path: apk-cache
          key: stock-apks-latest
          restore-keys: stock-apks-

      - name: Build, release, report
        id: build
        if: steps.plan.outputs.count != '0'
        run: bash scripts/build-all.sh ${{ steps.plan.outputs.apps }}

      - name: Cache key for original APKs
        id: ck
        if: always() && steps.plan.outputs.count != '0'
        run: |
          mkdir -p apk-cache
          ls -la apk-cache
          echo "key=stock-apks-$(ls apk-cache | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save original APKs to cache
        id: save
        if: always() && steps.ck.outputs.key != '' && steps.ck.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: apk-cache
          key: ${{ steps.ck.outputs.key }}

      - name: Drop older APK caches
        if: always() && steps.save.outcome == 'success'
        env:
          KEY: ${{ steps.ck.outputs.key }}
        run: gh cache list --key stock-apks- --limit 100 --json key --jq '.[].key' | grep -vx "$KEY" | xargs -r -n1 gh cache delete || true

      - name: Save state
        if: always() && steps.plan.outputs.count != '0'
        run: |
          bash scripts/commit.sh "state: build run ${{ github.run_number }}" state engine.lock

      - name: Update the store
        if: always() && steps.build.outputs.built != '' && steps.build.outputs.built != '0'
        run: gh workflow run pages.yml --ref main

      - name: Report a crash of this workflow
        if: failure() && steps.build.outcome != 'failure'
        run: >
          python3 scripts/ostore.py issue-fail workflow --title "Build workflow crashed"
          --step "${{ steps.plan.outcome == 'failure' && 'plan' || 'workflow' }}"
          --message "The build workflow itself failed before or after building. Open the run link for details."
