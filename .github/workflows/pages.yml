name: Store

# Rebuilds the store page (GitHub Pages) from the releases.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/ostore.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "41 5 * * 0" # weekly refresh of download counts

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false # queue updates; never cancel a deploy halfway

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - id: catalog
        name: Make data.json from releases
        run: python3 scripts/ostore.py catalog --out site/data.json

      - id: configure
        uses: actions/configure-pages@v6

      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Close an old store issue
        run: python3 scripts/ostore.py issue-ok store --title "Store update failed" || true

      - name: Report failure
        if: failure()
        run: >
          python3 scripts/ostore.py issue-fail store --title "Store update failed"
          --step "catalog=${{ steps.catalog.outcome }}, configure-pages=${{ steps.configure.outcome }}, upload=${{ steps.upload.outcome }}, deploy=${{ steps.deploy.outcome }}"
          --message "Updating the store page failed at the step marked 'failure'. Pages must be on (Settings > Pages > Source: GitHub Actions). A deploy failure right after another deploy is usually a temporary clash; the next run fixes it."
