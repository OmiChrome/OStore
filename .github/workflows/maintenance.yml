name: Maintenance

# Weekly: check the store works, delete releases older than 6 months, keep the repo awake.
on:
  schedule:
    - cron: "53 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Health check of the store
        id: health
        continue-on-error: true
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%/*}" | tr 'A-Z' 'a-z')
          python3 scripts/ostore.py health --url "https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" --report /tmp/health.md

      - name: Report store problems
        if: steps.health.outcome == 'failure'
        run: python3 scripts/ostore.py issue-fail store --title "Store health check failed" --step health-check --message-file /tmp/health.md

      - name: Close a fixed store problem
        if: steps.health.outcome == 'success'
        run: python3 scripts/ostore.py issue-ok store --title "Store health check failed" || true

      - name: Delete releases older than 6 months (newest of each app is kept)
        run: python3 scripts/ostore.py cleanup --days 180

      - name: Keep scheduled workflows alive
        # GitHub pauses schedules after 60 days without repo activity.
        run: |
          LAST=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - LAST )) -gt $(( 40 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > state/heartbeat.txt
            bash scripts/commit.sh "state: heartbeat" state/heartbeat.txt
          fi
